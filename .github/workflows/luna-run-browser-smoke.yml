name: Luna Run browser smoke test

on:
  push:
    branches: [main]
    paths:
      - 'gamezone/**'
      - 'tests/**'
      - '.github/workflows/luna-run-browser-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright
        run: npm install --no-save playwright

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Luna Run browser smoke test
        run: node tests/luna-run-browser-smoke.mjs

      - name: Upload browser screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: luna-run-browser-smoke
          path: |
            luna-run-browser-smoke.png
            luna-run-browser-smoke-failed.png
          if-no-files-found: ignore
          retention-days: 7
