name: Luna validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile Python modules
        run: python -m compileall -q LUNA config.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check GameZone JavaScript syntax
        run: node --check gamezone/gamezone.js

      - name: Validate app metadata
        run: python -m json.tool app.json > /dev/null

      - name: Check patch whitespace
        run: git diff --check
